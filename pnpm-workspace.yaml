minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - undici-types@6.21.0
  - jose@4.15.9
  - semver@6.3.1

shellEmulator: true

packages:
  - .

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

onlyBuiltDependencies:
  - '@firebase/util'
  - esbuild
  - protobufjs
